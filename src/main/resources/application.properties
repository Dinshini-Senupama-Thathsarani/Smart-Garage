spring.application.name=smart-garage-api
server.port=8082

# ---------- Database ----------
spring.datasource.url=jdbc:mysql://localhost:3306/smart_garage_db2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- JWT ----------
# IMPORTANT: change this secret before deployment, keep it out of git in real use (env var)
app.jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandomForSmartGarageAPI2026
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=604800000

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.smartgarage.api=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{36} - %msg%n

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- Bonus: Email (SMTP) ----------
# For Gmail: use an "App Password" (Google Account > Security > 2-Step Verification > App Passwords),
# NOT your normal Gmail password. If left as placeholders, emails are skipped (logged only) instead of crashing.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-16-char-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=false
app.mail.from=your-email@gmail.com
app.mail.admin-email=admin@smartgarage.lk

# ---------- Bonus: AI Report Summary (Anthropic Claude API) ----------
# Get a key at https://console.anthropic.com. If left as placeholder, the endpoint
# returns a friendly "not configured" message instead of failing.
app.ai.enabled=false
app.ai.api-key=YOUR_ANTHROPIC_API_KEY_HERE
app.ai.model=claude-sonnet-5
app.ai.api-url=https://api.anthropic.com/v1/messages

# ---------- Bonus: QR Code ----------
app.qrcode.base-url=http://localhost:${server.port}/api/v1
